name: Mise à jour quotidienne des tournois

on:
  # Tous les jours à 5h UTC (= 7h heure de Paris en été, 6h en hiver)
  schedule:
    - cron: '0 5 * * *'
  # Permet aussi de lancer manuellement depuis l'interface GitHub
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Récupérer le code du repo
      - name: Checkout du repo
        uses: actions/checkout@v4
      
      # 2. Installer Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      # 3. Installer les dépendances Python
      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      
      # 4. Lancer le pipeline complet
      - name: Lancement du pipeline
        env:
          HEADLESS: 'true'
        run: |
          python download.py
          python clean_and_geocode.py
          python generer_carte.py
      
      # 5. Commit + push les changements si nouveaux tournois
      - name: Commit des changements
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add tournois.csv index.html tournois.pdf
          git diff --staged --quiet || git commit -m "🤖 Mise à jour automatique des tournois"
          git push
